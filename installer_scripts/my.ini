[mysqld]
# Configuración básica de MySQL para Don Atilio
port=3307

# IMPORTANTE: Estas rutas se generarán automáticamente por setup_mysql.bat
# NO EDITAR MANUALMENTE
basedir=__MYSQL_DIR__
datadir=__DATA_DIR__

# Configuración de rendimiento
max_connections=100
key_buffer_size=16M
max_allowed_packet=16M
table_open_cache=64
sort_buffer_size=512K
net_buffer_length=8K
read_buffer_size=256K
read_rnd_buffer_size=512K
myisam_sort_buffer_size=8M

# Configuración de caracteres
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci

# Logs (también ruta absoluta)
log_error=__DATA_DIR__\mysql_error.log

# Deshabilitar strict mode para mayor compatibilidad
sql_mode=NO_ENGINE_SUBSTITUTION

# Seguridad básica
skip-external-locking

# CRÍTICO: Ejecutar como servicio de Windows
console=off

[client]
port=3307
default-character-set=utf8mb4

[mysql]
default-character-set=utf8mb4